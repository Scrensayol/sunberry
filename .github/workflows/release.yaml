name: Build and Release

on:
  workflow_dispatch:

jobs:
  draft-release:
    name: Create a draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # the tag only gets created when the draft is published
      - name: Create draft
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' sunberry/Cargo.toml | head -n 1)
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::$tag already has a release, bump the version in sunberry/Cargo.toml first"
            exit 1
          fi
          gh release create "$tag" --draft --title "sunberry $version" --notes "" \
            --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
    outputs:
      tag: ${{ steps.draft.outputs.tag }}

  build:
    name: Build on ${{ matrix.os }} for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: draft-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: sunberry-x86_64.exe

          # Linux
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: sunberry-x86_64-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact_name: sunberry-aarch64-linux-musl

          # macOS
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: sunberry-x86_64-macos
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: sunberry-aarch64-macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Build binary
        uses: houseabsolute/actions-rust-cross@v0
        with:
          command: "build"
          target: ${{ matrix.target }}
          args: "-p sunberry --profile dist"
          toolchain: "nightly"
          strip: false

      - name: Rename artifact
        shell: bash
        run: |
          ARTIFACT_DIR="target/${{ matrix.target }}/dist"
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv "${ARTIFACT_DIR}/sunberry.exe" "${ARTIFACT_DIR}/${{ matrix.artifact_name }}"
          else
            mv "${ARTIFACT_DIR}/sunberry" "${ARTIFACT_DIR}/${{ matrix.artifact_name }}"
          fi

      # gh finds the draft by its tag, upload-release-action couldn't and made a
      # second, published release instead
      - name: Upload release asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.draft-release.outputs.tag }}" \
            "target/${{ matrix.target }}/dist/${{ matrix.artifact_name }}" \
            --clobber --repo "${{ github.repository }}"
