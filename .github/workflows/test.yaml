name: Test

on:
  push:
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # the toolchain comes from rust-toolchain, rustup installs it on first use
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p sunberry -p lua51-lifter

      - name: Test
        run: cargo test --release -p ast -p cfg -p restructure -p luau-lifter

      - name: Build round-trip harness
        run: cargo build --profile harness -p harness

      - name: Round-trip snapshot programs
        run: target/harness/sunberry-harness check --work harness/out/check

      # fails only on failures missing from harness/baseline.json. after a fix, run
      # `sunberry-harness fuzz --seeds 200 --baseline harness/baseline.json --update-baseline`
      - name: Round-trip generated programs
        run: target/harness/sunberry-harness fuzz --seeds 200 --baseline harness/baseline.json --work harness/out/fuzz

      # the new core may refuse what it can't do yet, but never print something wrong
      - name: Round-trip the new core on straight-line programs
        run: target/harness/sunberry-harness fuzz --seeds 200 --grammar straight --decompiler next --work harness/out/next

      - name: Upload failing round trips
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: round-trip-failures
          path: harness/out
          retention-days: 7
