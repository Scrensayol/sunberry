name: Test

on:
  push:
  pull_request:

env:
  # sunberry as Rosetta runs every decompiler: a command that gets a raw bytecode file and prints
  # source. --strict makes a refusal a refusal instead of the old core's output under a header
  NEXT: next=target/release/sunberry decompile --strict -e 1 -n script -i {} -o /dev/stdout
  OLD: sunberry=target/release/sunberry decompile --core old -e 1 -n script -i {} -o /dev/stdout
  ROSETTA: rosetta/target/release/rosetta

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # the round-trip suite (https://github.com/Scrensayol/rosetta)
      - name: Check out Rosetta
        uses: actions/checkout@v4
        with:
          repository: Scrensayol/rosetta
          path: rosetta

      # the toolchain comes from rust-toolchain, rustup installs it on first use
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            rosetta

      - name: Build
        run: cargo build --release -p sunberry -p lua51-lifter

      - name: Test
        run: cargo test --release -p ast -p cfg -p restructure -p luau-lifter -p sunberry-core

      - name: Build Rosetta
        run: cargo build --release --manifest-path rosetta/Cargo.toml

      # every step fails only on failures (and, for the new core, refusals) missing from its
      # baseline in .github/rosetta. after a fix, rerun the step with --update-baseline
      - name: Round-trip snapshot programs
        run: $ROSETTA check --decompiler "$NEXT" --decompiler "$OLD" core/tests/cases samples/luau luau-lifter/tests/cases --baseline .github/rosetta/check.json --work out/check

      - name: Round-trip generated programs (old core)
        run: $ROSETTA fuzz --seeds 200 --decompiler "$OLD" --baseline .github/rosetta/fuzz-old-core.json --work out/fuzz

      # the new core may refuse what it can't do, but never print something wrong, and never
      # start refusing a program it used to do
      - name: Round-trip the new core on straight-line programs
        run: $ROSETTA fuzz --seeds 200 --grammar straight --decompiler "$NEXT" --baseline .github/rosetta/next-straight.json --work out/next

      - name: Round-trip the new core on branching programs
        run: $ROSETTA fuzz --seeds 200 --grammar branches --decompiler "$NEXT" --baseline .github/rosetta/next-branches.json --work out/next-branches

      - name: Round-trip the new core on everything
        run: $ROSETTA fuzz --seeds 200 --decompiler "$NEXT" --baseline .github/rosetta/next-full.json --work out/next-full

      - name: Upload failing round trips
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: round-trip-failures
          path: out
          retention-days: 7
