[package]
name = "harness"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "sunberry-harness"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
luau-lifter = { path = "../luau-lifter" }
# pinned: the Luau version decides what the reference programs compile to, so moving it
# is a baseline change, not something a fresh resolve should do on its own
mlua = { version = "=0.12.2", features = ["luau", "vendored"] }
luau0-src = "=0.22.0"
rayon = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
tempfile = "3"
wait-timeout = "0.2"
