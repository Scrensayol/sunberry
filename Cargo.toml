[workspace]
resolver = "3"
members = [
    "cfg",
    "ast",
    "lua51-lifter",
    "lua51-deserializer",
    "luau-lifter",
    "restructure",
    "luau-worker",
    "sunberry",
]

[workspace.package]
edition = "2024"
authors = [
    "Mathias Pedersen <mathias.pedersen834@gmail.com>",
    "Jujhar Singh <jujharsmc@gmail.com>",
    "Amit Bashan <amit.bashan@icloud.com>",
    "Stefanuk12",
]

[profile.release]
debug = true
lto = true
# strip = true
# panic = "abort"

# what releases ship: release keeps debug info for profiling, this drops it.
# stripping here also works for cross targets, where the host's strip can't
[profile.dist]
inherits = "release"
debug = false
strip = true
