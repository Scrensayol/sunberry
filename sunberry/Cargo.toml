[package]
name = "sunberry"
version = "0.4.0"
edition.workspace = true
authors.workspace = true
default-run = "sunberry"

[dependencies]
axum = "0.8"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
lua51-lifter = { path = "../lua51-lifter" }
luau-lifter = { path = "../luau-lifter" }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.42", features = ["rt-multi-thread"] }
tower-http = { version = "0.6", features = ["compression-gzip", "compression-deflate"] }
tracing = "0.1"
tracing-subscriber = "0.3"
# decompiling is allocation heavy: ~60% faster than musl's malloc, ~20% faster than glibc's
mimalloc = { version = "0.1", default-features = false }
